:root{--bg:#ffffff;--fg:#1a1a1a;--muted:#555555;--line:#c8c8c8;--accent:#0b57d0;--ok:#146c2e;--bad:#a8200d;--card:#f4f4f4;--s0:#0b57d0;--s1:#b3261e;--s2:#146c2e;--s3:#7a4d00;--s4:#6b3fa0}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#ececec;--muted:#b0b0b0;--line:#444444;--accent:#8ab4f8;--ok:#7ddc8f;--bad:#ff8a7a;--card:#1e1e1e;--s0:#8ab4f8;--s1:#f28b82;--s2:#81c995;--s3:#fdd663;--s4:#d7aefb}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:46rem;margin:0 auto;padding:1.5rem 16px}h1{font-size:1.5rem;margin:.2rem 0 1rem}
a{color:var(--accent)}label{display:block;font-weight:600;margin-bottom:.3rem}
.row{display:flex;gap:.5rem}input{flex:1;min-width:0;font:inherit;padding:.6rem;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:.6rem 1rem;border:2px solid var(--accent);border-radius:6px;background:var(--bg);color:var(--accent);cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border-radius:8px;padding:1rem;margin:1rem 0}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
dl{display:grid;grid-template-columns:max-content 1fr;gap:.2rem .8rem;margin:0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}

.scroll{overflow-x:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.8rem}small,.muted{color:var(--muted)}
svg text{fill:var(--fg);font-size:11px}svg .axis{stroke:var(--muted)}
svg .s0{stroke:var(--s0)}svg text.t0{fill:var(--s0)}svg .s1{stroke:var(--s1)}svg text.t1{fill:var(--s1)}svg .s2{stroke:var(--s2)}svg text.t2{fill:var(--s2)}svg .s3{stroke:var(--s3)}svg text.t3{fill:var(--s3)}svg .s4{stroke:var(--s4)}svg text.t4{fill:var(--s4)}</style></head><body><main><h1>Does it still build?</h1><form id="f" role="search"><label for="q">GitHub repository (owner/repo)</label><div class="row"><input id="q" name="q" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="owner/repo" required><button type="submit">Look up</button></div></form><div id="out" tabindex="-1" aria-live="polite"></div><div class="scroll"><table><caption class="muted">Build success by ecosystem and cohort</caption><thead><tr><th scope="col">Ecosystem</th><th scope="col">Cohort</th><th scope="col">Repos</th><th scope="col">Early built</th><th scope="col">Now built</th></tr></thead><tbody><tr><td>go</td><td>all</td><td>900</td><td>434 (48%)</td><td>656 (73%)</td></tr><tr><td>node</td><td>all</td><td>900</td><td>364 (40%)</td><td>358 (40%)</td></tr><tr><td>python</td><td>all</td><td>900</td><td>406 (45%)</td><td>480 (53%)</td></tr><tr><td>rust</td><td>all</td><td>900</td><td>298 (33%)</td><td>510 (57%)</td></tr></tbody></table></div><p><small><a href="methods.html">Methods</a> · <a href="mailto:support@ripplarity.com?subject=Wrong%20result%20report">Report a wrong result</a></small></p></main><script>
(function(){
var f=document.getElementById('f'),q=document.getElementById('q'),out=document.getElementById('out'),keys=null,cache={},pending=null;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function keyFor(slug){var k=slug.toLowerCase().replace(/[^a-z0-9\/]/g,'_').replace(/\//g,'-')+Array(64+1).join('_');var best=null;
 keys.forEach(function(x){if(k.indexOf(x)===0&&(!best||x.length>best.length))best=x;});return best;}
function snap(label,r){if(!r)return '<div class="card"><h2>'+label+'</h2><p>No build recorded.</p></div>';
 var h='<div class="card"><h2>'+label+': <span class="'+(r.built?'ok">built':'bad">did not build')+'</span></h2><dl>';
 var rows=[['Failure class',r.failure_class],['Toolchain',(r.toolchain||[]).join('; ')],['Date (UTC)',(r.started_utc||'').slice(0,10)],
  ['Commit',r.commit],['Ecosystem',r.ecosystem],['Exit code',r.exit_code],['Duration (s)',r.duration_s],['Recipe',r.recipe_id],
  ['Image digest',r.image_digest],['Log SHA-256',r.log_sha256],['Receipt SHA-256',r.receipt_sha256]];
 rows.forEach(function(x){if(x[1]!==undefined&&x[1]!==null&&x[1]!=='')h+='<dt>'+x[0]+'</dt><dd>'+esc(x[1])+'</dd>';});
 h+='</dl>';if(r.log_tail)h+='<details><summary>Log tail (scrubbed)</summary><pre>'+esc(r.log_tail)+'</pre></details>';return h+'</div>';}
function show(slug,rec){if(!rec){out.innerHTML='<p>'+esc(slug)+' is not in the study.</p>';return;}
 out.innerHTML='<h2>'+esc(rec.name)+'</h2>'+snap('Early snapshot',rec.ERA)+snap('Current head',rec.NOW);out.focus();}
function look(v){v=v.trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\/+$/,'');var m=v.match(/^([^\/\s]+)\/([^\/\s]+)$/);
 if(!m){out.innerHTML='<p>Type owner/repo, for example torvalds/linux.</p>';out.focus();return;}
 var k=keyFor(m[1]+'/'+m[2]);if(!k){show(v,null);return;}
 var go=function(d){show(v,d[v.toLowerCase()]);};
 if(cache[k])return go(cache[k]);out.textContent='Loading…';
 fetch('data/'+k+'.json').then(function(r){return r.json();}).then(function(d){cache[k]=d;go(d);})
 .catch(function(){out.textContent='Could not load data.';});}
fetch('data/index.json').then(function(r){return r.json();}).then(function(d){keys=d.keys;
 if(pending!==null){look(pending);pending=null;}
 else if(location.hash.length>1){var h=location.hash.slice(1);try{h=decodeURIComponent(h);}catch(e){}q.value=h;look(h);}})
 .catch(function(){out.textContent='Could not load data.';});
f.addEventListener('submit',function(e){e.preventDefault();var v=q.value;try{history.replaceState(null,'','#'+encodeURIComponent(v.trim()));}catch(x){}
 if(!keys){pending=v;out.textContent='Loading…';return;}look(v);});
})();
</script></body></html>
