<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Methods</title><link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiByeD0iMyIgZmlsbD0iIzMzNDE1NSIvPjxwYXRoIGQ9Ik0zIDRoMTBNMyA4aDdNMyAxMmg0IiBzdHJva2U9IiNmOGZhZmMiIHN0cm9rZS13aWR0aD0iMiIvPjwvc3ZnPg=="><style>
:root{--bg:#ffffff;--fg:#1a1a1a;--muted:#555555;--line:#c8c8c8;--accent:#0b57d0;--ok:#146c2e;--bad:#a8200d;--card:#f4f4f4;--s0:#0b57d0;--s1:#b3261e;--s2:#146c2e;--s3:#7a4d00;--s4:#6b3fa0}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#ececec;--muted:#b0b0b0;--line:#444444;--accent:#8ab4f8;--ok:#7ddc8f;--bad:#ff8a7a;--card:#1e1e1e;--s0:#8ab4f8;--s1:#f28b82;--s2:#81c995;--s3:#fdd663;--s4:#d7aefb}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:46rem;margin:0 auto;padding:1.5rem 16px}h1{font-size:1.5rem;margin:.2rem 0 1rem}
a{color:var(--accent)}label{display:block;font-weight:600;margin-bottom:.3rem}
.row{display:flex;gap:.5rem}input{flex:1;min-width:0;font:inherit;padding:.6rem;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:.6rem 1rem;border:2px solid var(--accent);border-radius:6px;background:var(--bg);color:var(--accent);cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border-radius:8px;padding:1rem;margin:1rem 0}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
dl{display:grid;grid-template-columns:max-content 1fr;gap:.2rem .8rem;margin:0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border-bottom:1px solid var(--line);padding:.3rem;text-align:left}
.scroll{overflow-x:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.8rem}small,.muted{color:var(--muted)}
svg text{fill:var(--fg);font-size:11px}svg .axis{stroke:var(--muted)}
svg .s0{stroke:var(--s0)}svg text.t0{fill:var(--s0)}svg .s1{stroke:var(--s1)}svg text.t1{fill:var(--s1)}svg .s2{stroke:var(--s2)}svg text.t2{fill:var(--s2)}svg .s3{stroke:var(--s3)}svg text.t3{fill:var(--s3)}svg .s4{stroke:var(--s4)}svg text.t4{fill:var(--s4)}</style></head><body><main><p><a href="index.html">← Lookup</a></p><h1>Methods</h1><p>The study follows a pre-registered protocol with these sections:</p><ol><li>Question</li><li>Population</li><li>Snapshots</li><li>Build recipe</li><li>Hypotheses</li><li>Failure taxonomy</li><li>Reporting</li></ol><p>Author: Ripplarity</p></main></body></html>
